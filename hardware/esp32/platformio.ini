; DeepSee Guardian — ESP32 Sensor Gateway (Phase 6A)
; ============================================================
; Board: ESP32 DevKit V1 (single device: esp32_001)
; Sensor: DS18B20 temperature probe (OneWire) — first real sensor.
; Transport: authenticated HTTP POST to /api/sensors/ingest.
;
; Build:  pio run
; Upload: pio run --target upload
; Monitor: pio device monitor --baud 115200

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -DCORE_DEBUG_LEVEL=3
lib_deps =
  paulstoffregen/OneWire@^2.3.8
  milesburton/DallasTemperature@^3.11.0
  bblanchon/ArduinoJson@^7.0.4
